[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delegation-receipts"
version = "0.1.0"
description = "Verify what a subagent says it did: parse a receipt, check the files, re-run the command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["engine"]
