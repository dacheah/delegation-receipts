name: delegation-receipts
label: Delegation Receipts
kind: standalone
version: 0.3.0
author: danielcheah
homepage: https://github.com/dacheah/delegation-receipts
description: >
  Verify what a subagent says it did. Every child ends its reply with a
  machine-checkable receipt (status, changed files, the one command that
  proves the work). When the child stops, the plugin checks each claimed file
  exists, matches the claim against the writes the child's own tool history
  records, re-runs the cited command with no shell, its own process group and
  a timeout, and hands the verdict to the parent - inline on the tool result,
  or on the next turn for a background child. A child that says "all 14 tests
  pass" when 3 fail comes back marked unverified with the failing output
  attached. Claimed-but-never-written work is caught even when the file
  exists. Set `delegation.backend: receipts`; `hermes receipts` shows the
  ledger.
requires_hermes: ">=0.22.5"
provides_tools: []
provides_hooks:
  - subagent_stop
  - transform_tool_result
  - pre_llm_call
